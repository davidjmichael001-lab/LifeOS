name: LifeOS
options:
  bundleIdPrefix: davidmichael
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  LifeOS:
    type: application
    platform: iOS
    sources: [LifeOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: davidmichael.LifeOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick progress photos to keep privately in the app."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take progress photos stored only on this phone."
        TARGETED_DEVICE_FAMILY: "1"
  LifeOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LifeOSTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LifeOS
schemes:
  LifeOS:
    build:
      targets:
        LifeOS: all
    test:
      targets: [LifeOSTests]
